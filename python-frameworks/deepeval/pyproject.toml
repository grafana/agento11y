[project]
name = "agento11y-deepeval"
version = "0.17.0"
description = "DeepEval experiment publishing for the Grafana Agent Observability Python SDK"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "agento11y>=0.17.0",
  "deepeval>=4.2.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agento11y_deepeval*"]

[tool.setuptools.package-data]
agento11y_deepeval = ["py.typed"]
