<!doctype html>
<html lang="en" data-theme="{{AGENTO11Y_THEME}}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>agento11y local</title>
  <script nonce="{{AGENTO11Y_CSP_NONCE}}">
    (() => {
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
      const applySystemTheme = ({ matches }) => {
        document.documentElement.dataset.systemTheme = matches ? "dark" : "light";
      };
      applySystemTheme(systemTheme);
      systemTheme.addEventListener("change", applySystemTheme);
    })();
  </script>
  <link rel="stylesheet" href="/assets/app.css"/>

  <!-- React, ReactDOM, and markdown-to-jsx are served by this daemon, not by a
       CDN. The viewer holds private session data, so opening it must not tell a
       third party that you did. It also has to work with no network at all.
       markdown-to-jsx reads the global React when it loads, so it has to come
       after it. app.js reads all three as globals, so it comes after all of
       them. -->
  <script src="/assets/vendor/react.production.min.js"></script>
  <script src="/assets/vendor/react-dom.production.min.js"></script>
  <script src="/assets/vendor/markdown-to-jsx.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
