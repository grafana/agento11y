name: Publish Python SDKs to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver bump type (major / minor / patch)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor
      package:
        description: 'Package to release (all releases the whole Python SDK set)'
        required: true
        type: choice
        options:
          - all
          - agento11y
          - agento11y-openai
          - agento11y-anthropic
          - agento11y-gemini
          - agento11y-langchain
          - agento11y-langgraph
          - agento11y-openai-agents
          - agento11y-llamaindex
          - agento11y-google-adk
          - agento11y-litellm
          - agento11y-pydantic-ai
          - agento11y-deepeval
          - agento11y-strands
          - agento11y-claude-agent-sdk
          - agento11y-hermes
        default: all
      dry-run:
        description: 'Preview only, do not publish, open a PR, or push tags'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'grafana/agento11y' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
      dependents: ${{ steps.bump.outputs.dependents }}

    steps:
      - name: Generate GitHub token
        id: generate-github-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: grafana-plugins-platform-bot

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.generate-github-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0  # changelog script needs full git history

      - name: Setup Git
        run: |
          git config user.name 'grafana-plugins-platform-bot[bot]'
          git config user.email '144369747+grafana-plugins-platform-bot[bot]@users.noreply.github.com'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build 'twine==7.0.0' 'packaging==26.2'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Compute and apply version bump
        id: bump
        shell: bash
        env:
          BUMP: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
          PACKAGE: ${{ inputs.package }}
        run: |
          PACKAGE_DIRS=(
            python
            python-providers/openai
            python-providers/anthropic
            python-providers/gemini
            python-frameworks/langchain
            python-frameworks/langgraph
            python-frameworks/openai-agents
            python-frameworks/llamaindex
            python-frameworks/google-adk
            python-frameworks/litellm
            python-frameworks/pydantic-ai
            python-frameworks/deepeval
            python-frameworks/strands
            python-frameworks/claude-agent-sdk
            plugins/hermes
          )

          TARGET=python
          if [[ "$PACKAGE" != all ]]; then
            TARGET=
            for dir in "${PACKAGE_DIRS[@]}"; do
              name=$(grep '^name = ' "${dir}/pyproject.toml" | head -1 | sed 's/name = "\(.*\)"/\1/')
              if [[ "$name" == "$PACKAGE" ]]; then
                TARGET=$dir
                break
              fi
            done
            if [[ -z "$TARGET" ]]; then
              echo "::error::Unknown Python package: ${PACKAGE}"
              exit 1
            fi
          fi
          CURRENT=$(grep '^version = ' "${TARGET}/pyproject.toml" | head -1 | sed 's/version = "\(.*\)"/\1/')

          if [[ "$PACKAGE" == all || "$PACKAGE" == agento11y ]]; then
            # A tag appears only when the release PR merges, so a changelog top
            # version ahead of the newest tag means the last release merged
            # untagged. Stop, rather than emit a second section for it.
            LATEST=$(git tag -l 'sdk-python/v*' | sed 's|sdk-python/v||' | sort -V | tail -1)
            LATEST=${LATEST:-0.0.0}
            TOP=$(./.github/scripts/changelog-top-version.sh python/CHANGELOG.md)
            if [[ -n "$TOP" && "$TOP" != "$LATEST" \
                  && "$(printf '%s\n%s\n' "$TOP" "$LATEST" | sort -V | tail -1)" == "$TOP" ]]; then
              echo "::error::python/CHANGELOG.md top v${TOP} is ahead of the latest sdk-python/v* tag v${LATEST}; create the missing tag and retry."
              exit 1
            fi
          fi

          NEW=$(./.github/scripts/bump-version.sh "$BUMP" "$CURRENT")
          echo "new-version=${NEW}" >> "$GITHUB_OUTPUT"

          if [[ "$PACKAGE" == all || "$PACKAGE" == agento11y ]]; then
            ROW=$(jq -r '.[] | select(.id == "python")' .github/sdk-releases.json)
            mapfile -t PATHS < <(jq -r '.paths[]' <<<"$ROW")
            SECTION=$(./.github/scripts/changelog-for-release.sh "$NEW" sdk-python "${PATHS[@]}")
            printf '%s\n' "$SECTION" > /tmp/section.md
            printf '%s\n' "$SECTION" | ./.github/scripts/prepend-changelog.sh python/CHANGELOG.md
          fi

          {
            echo "## Python SDK release plan"
            echo ""
            echo "- package: \`${PACKAGE}\`"
            echo "- bump type: \`${BUMP}\`"
            if [[ "$PACKAGE" == all ]]; then
              echo "- core current: \`${CURRENT}\`"
              echo "- core new: \`${NEW}\`"
            else
              echo "- current: \`${CURRENT}\`"
              echo "- new: \`${NEW}\`"
            fi
            echo "- dry-run: \`${DRY_RUN}\`"
            if [[ "$PACKAGE" == all || "$PACKAGE" == agento11y ]]; then
              echo "- tag: \`sdk-python/v${NEW}\`"
              echo ""
              echo "### Changelog section"
              echo ""
              printf '%s\n' "$SECTION"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PACKAGE" == all ]]; then
            mapfile -t DEPENDENTS < <(for dir in "${PACKAGE_DIRS[@]:1}"; do grep '^name = ' "${dir}/pyproject.toml" | head -1 | sed 's/name = "\(.*\)"/\1/'; done)
          elif [[ "$PACKAGE" == agento11y ]]; then
            DEPENDENTS=()
          else
            DEPENDENTS=("$PACKAGE")
          fi
          printf 'dependents=%s\n' "$(printf '%s\n' "${DEPENDENTS[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

          for dir in "${PACKAGE_DIRS[@]}"; do
            if [[ "$PACKAGE" != all && "$dir" != "$TARGET" ]]; then
              continue
            fi
            file="${dir}/pyproject.toml"
            VERSION=$NEW
            if [[ "$PACKAGE" == all && "$dir" != python ]]; then
              current=$(grep '^version = ' "$file" | head -1 | sed 's/version = "\(.*\)"/\1/')
              VERSION=$(./.github/scripts/bump-version.sh "$BUMP" "$current")
            fi
            sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" "$file"
            if [[ "$PACKAGE" == all && "$dir" != "python" && "$dir" != "plugins/hermes" ]]; then
              sed -i "s/\"agento11y>=.*\"/\"agento11y>=${NEW}\"/" "$file"
            fi
            if [[ "$dir" == plugins/hermes ]]; then
              echo "hermes-version=${VERSION}" >> "$GITHUB_OUTPUT"
            fi
            echo "  updated ${file} to ${VERSION}"
          done
          if [[ "$PACKAGE" == all || "$PACKAGE" == agento11y-hermes ]]; then
            (cd plugins/hermes && uv --no-config lock)
          fi

      - name: Build distributions
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          PACKAGE_DIRS=(
            python
            python-providers/openai
            python-providers/anthropic
            python-providers/gemini
            python-frameworks/langchain
            python-frameworks/langgraph
            python-frameworks/openai-agents
            python-frameworks/llamaindex
            python-frameworks/google-adk
            python-frameworks/litellm
            python-frameworks/pydantic-ai
            python-frameworks/deepeval
            python-frameworks/strands
            python-frameworks/claude-agent-sdk
          )

          for dir in "${PACKAGE_DIRS[@]}"; do
            pkg_name=$(grep '^name = ' "${dir}/pyproject.toml" | head -1 | sed 's/name = "\(.*\)"/\1/')
            if [[ "$PACKAGE" != all && "$PACKAGE" != "$pkg_name" ]]; then
              continue
            fi
            echo "Building ${pkg_name} from ${dir}..."
            python -m build "$dir" --outdir "dist/${pkg_name}"
          done
          if [[ "$PACKAGE" == all || "$PACKAGE" == agento11y-hermes ]]; then
            bash plugins/hermes/scripts/run-check.sh build --expected-version "${{ steps.bump.outputs.hermes-version }}" --output-dir "$GITHUB_WORKSPACE/dist/agento11y-hermes"
          fi
          python -m twine check --strict dist/*/*

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdk-dists
          path: dist/
          retention-days: 5

      - name: Build release PR body
        if: ${{ !inputs.dry-run }}
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
          PACKAGE: ${{ inputs.package }}
        run: |
          if [[ "$PACKAGE" == all || "$PACKAGE" == agento11y ]]; then
            {
              if [[ "$PACKAGE" == all ]]; then
                echo "Releases the Python packages, including \`agento11y\` at \`${NEW_VERSION}\`."
              else
                echo "Releases \`agento11y\` at \`${NEW_VERSION}\`."
              fi
              echo ""
              cat /tmp/section.md
              echo ""
              echo "---"
              echo ""
              echo "Merging this PR creates \`sdk-python/v${NEW_VERSION}\` via \`tag-releases-on-merge.yml\`."
            } > /tmp/pr-body.md
          else
            echo "Releases \`${PACKAGE}\` at \`${NEW_VERSION}\` without changing the shared Python SDK changelog or tag." > /tmp/pr-body.md
          fi

      - name: Open release PR
        id: cpr
        if: ${{ !inputs.dry-run }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-github-token.outputs.token }}
          branch: release/${{ inputs.package == 'all' && 'sdk-python' || inputs.package }}-${{ steps.bump.outputs.new-version }}
          base: main
          sign-commits: true
          add-paths: |
            python/CHANGELOG.md
            python/pyproject.toml
            python-providers/*/pyproject.toml
            python-frameworks/*/pyproject.toml
            plugins/hermes/pyproject.toml
            plugins/hermes/uv.lock
          commit-message: "chore(${{ inputs.package == 'all' && 'sdk-python' || inputs.package }}): bump version to ${{ steps.bump.outputs.new-version }}"
          title: "chore(${{ inputs.package == 'all' && 'sdk-python' || inputs.package }}): bump version to ${{ steps.bump.outputs.new-version }}"
          body-path: /tmp/pr-body.md

      - name: Enable auto-merge
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: gh pr merge "${BRANCH}" --auto --squash --delete-branch

  publish-core:
    if: ${{ !inputs.dry-run && (inputs.package == 'all' || inputs.package == 'agento11y') }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdk-dists
          path: dist/

      - name: Publish agento11y to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/agento11y/
          # PEP 740 attestations via OIDC (id-token: write). Default since
          # v1.11.0; pin it explicitly so future action upgrades that flip the
          # default would surface as a workflow change instead of a silent
          # regression.
          attestations: true

  publish-dependents:
    if: ${{ always() && !inputs.dry-run && needs.build.result == 'success' && (inputs.package == 'all' && needs.publish-core.result == 'success' || inputs.package != 'all' && inputs.package != 'agento11y') }}
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.build.outputs.dependents || '[]') }}

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdk-dists
          path: dist/

      - name: Publish ${{ matrix.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/${{ matrix.package }}/
          attestations: true
