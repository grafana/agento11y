name: Publish .NET SDK to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver bump type (major / minor / patch)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor
      dry-run:
        description: 'Preview only, do not publish or push tags'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'grafana/agento11y' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
      changelog-section: ${{ steps.bump.outputs.section }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
      FORCE_COLOR: 3
      NUGET_XMLDOC_MODE: skip
      TERM: xterm

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute next version
        id: bump
        shell: bash
        env:
          BUMP: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          CURRENT=$(git tag -l 'sdk-dotnet/v*' | sed 's|sdk-dotnet/v||' | sort -V | tail -1)
          CURRENT=${CURRENT:-0.0.0}

          # A tag appears only when the release PR merges, so a changelog top
          # version ahead of the newest tag means the last release merged
          # untagged. Stop, rather than emit a second section for it.
          TOP=$(./.github/scripts/changelog-top-version.sh dotnet/CHANGELOG.md)
          if [[ -n "$TOP" && "$TOP" != "$CURRENT" \
                && "$(printf '%s\n%s\n' "$TOP" "$CURRENT" | sort -V | tail -1)" == "$TOP" ]]; then
            echo "::error::dotnet/CHANGELOG.md top v${TOP} is ahead of the latest sdk-dotnet/v* tag v${CURRENT}; create the missing tag and retry."
            exit 1
          fi

          NEW=$(./.github/scripts/bump-version.sh "$BUMP" "$CURRENT")

          echo "new-version=${NEW}" >> "$GITHUB_OUTPUT"

          # The release-pr job checks out without full history, so generate the
          # section here and hand it over as a job output.
          ROW=$(jq -r '.[] | select(.id == "dotnet")' .github/sdk-releases.json)
          mapfile -t PATHS < <(jq -r '.paths[]' <<<"$ROW")
          SECTION=$(./.github/scripts/changelog-for-release.sh "$NEW" sdk-dotnet "${PATHS[@]}")
          {
            echo 'section<<SECTION_EOF'
            printf '%s\n' "$SECTION"
            echo 'SECTION_EOF'
          } >> "$GITHUB_OUTPUT"

          {
            echo "## .NET SDK release plan"
            echo ""
            echo "- bump type: \`${BUMP}\`"
            echo "- current: \`${CURRENT}\`"
            echo "- new: \`${NEW}\`"
            echo "- tag: \`sdk-dotnet/v${NEW}\`"
            echo "- dry-run: \`${DRY_RUN}\`"
            echo ""
            echo "### Changelog section"
            echo ""
            printf '%s\n' "$SECTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: dotnet/global.json

      - name: Pack
        env:
          PKG_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          dotnet pack dotnet/Agento11y.DotNet.slnx -c Release \
            -p:Version="${PKG_VERSION}" -p:PackageVersion="${PKG_VERSION}"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-packages
          path: ./dotnet/artifacts/package/release
          retention-days: 5

  publish:
    if: ${{ !inputs.dry-run }}
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: NuGet.org
      url: https://www.nuget.org/profiles/Grafana

    permissions:
      contents: read
      id-token: write

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      TERM: xterm

    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-packages
          path: packages/

      - name: NuGet log in
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544 # v1.1.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        # No --skip-duplicate. The next version is derived from the latest
        # sdk-dotnet/v* tag, and that tag now appears only when the release PR
        # merges, so a re-dispatch while the PR is open recomputes the same
        # version. Failing on the duplicate stops the run before release-pr
        # opens a second PR claiming a version NuGet already holds.
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json

  release-pr:
    if: ${{ !inputs.dry-run }}
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Generate GitHub token
        id: generate-github-token
        uses: grafana/shared-workflows/actions/create-github-app-token@259ba21cb3ff07724f331e26d926d655d24b317b # create-github-app-token/v0.2.3
        with:
          github_app: grafana-plugins-platform-bot

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.generate-github-token.outputs.token }}
          persist-credentials: true

      - name: Setup Git
        run: |
          git config user.name 'grafana-plugins-platform-bot[bot]'
          git config user.email '144369747+grafana-plugins-platform-bot[bot]@users.noreply.github.com'

      - name: Update CHANGELOG.md
        shell: bash
        env:
          NEW_VERSION: ${{ needs.build.outputs.new-version }}
          SECTION: ${{ needs.build.outputs.changelog-section }}
        run: |
          printf '%s\n' "$SECTION" > /tmp/section.md
          ./.github/scripts/prepend-changelog.sh dotnet/CHANGELOG.md < /tmp/section.md

          {
            echo "The .NET SDK \`${NEW_VERSION}\` is already published to NuGet. This PR records its changelog entry."
            echo ""
            cat /tmp/section.md
            echo ""
            echo "---"
            echo ""
            echo "Merging this PR creates \`sdk-dotnet/v${NEW_VERSION}\` via \`tag-releases-on-merge.yml\`."
          } > /tmp/pr-body.md

      - name: Open release PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-github-token.outputs.token }}
          branch: release/sdk-dotnet-${{ needs.build.outputs.new-version }}
          base: main
          sign-commits: true
          add-paths: dotnet/CHANGELOG.md
          commit-message: "chore(sdk-dotnet): release v${{ needs.build.outputs.new-version }}"
          title: "chore(sdk-dotnet): release v${{ needs.build.outputs.new-version }}"
          body-path: /tmp/pr-body.md

      - name: Enable auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: gh pr merge "${BRANCH}" --auto --squash --delete-branch
