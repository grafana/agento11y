name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Select CI suites
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select suites from the complete PR diff
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ci-scope.py

  scripts:
    name: Workflow scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test CI suite selection
        run: python3 .github/scripts/ci-scope.test.py

      - name: Test bump-version.sh
        run: ./.github/scripts/bump-version.test.sh

      - name: Test changelog-for-release.sh
        run: ./.github/scripts/changelog-for-release.test.sh

      - name: Test prepend-changelog.sh
        run: ./.github/scripts/prepend-changelog.test.sh

      - name: Test changelog-top-version.sh
        run: ./.github/scripts/changelog-top-version.test.sh

      - name: Test changelog-latest-section.sh
        run: ./.github/scripts/changelog-latest-section.test.sh

  proto:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'proto')
    name: Protobuf drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Check protobuf stubs are in sync
        run: mise run check:proto

      - name: Check generated redaction pattern tables are in sync
        run: mise run check:redaction

      - name: Lint the redaction pattern generator
        run: mise run lint:ts:redaction-generator

  conformance:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'conformance')
    name: Cross-SDK conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: dotnet/global.json

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Core conformance
        run: mise run test:sdk:core-conformance

      # The hooks:evaluate wire format has no generated stubs, so
      # conformance/hooks/ is its only contract. check:proto cannot see a
      # divergence here, so this task runs as its own step.
      - name: Hook conformance
        run: mise run test:sdk:hooks-conformance

      # The experiment ingest routes have no generated stubs either, so
      # conformance/experiments/ is their only cross-language contract.
      - name: Experiment conformance
        run: mise run test:sdk:experiments-conformance

      - name: GenAI semantic-convention live check
        run: mise run test:go:conformance

      - name: Skill-load, resource-read, and command semantic-convention live check
        run: mise run test:go:tool-execution-kinds-conformance

      - name: OTel GenAI race tests
        run: mise run test:go:otelgenai-race

  go-module:
    needs: changes
    name: Go module
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - go
          - go-providers/anthropic
          - go-providers/openai
          - go-providers/gemini
          - go-frameworks/google-adk
          - plugins/agento11y
          - go/otelgenai/weavertest
        include:
          - module: go/otelgenai/conformance
            lint_args: --timeout=5m --build-tags=conformance,tool_execution_kinds
    steps:
      - name: Check whether this module is affected
        id: scope
        run: echo "run=${{ contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'go-all') || contains(fromJSON(needs.changes.outputs.scope), matrix.module) }}" >> "$GITHUB_OUTPUT"

      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: golangci-lint
        if: steps.scope.outputs.run == 'true'
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        env:
          # Force each module to lint with GOWORK=off so it resolves its own
          # go.mod, matching the local `mise run lint:go` behavior.
          GOWORK: "off"
        with:
          args: ${{ matrix.lint_args || '--timeout=5m' }}
          working-directory: ./${{ matrix.module }}

      - name: Test
        if: steps.scope.outputs.run == 'true'
        run: cd ${{ matrix.module }} && GOWORK=off go test ./...

      # TestAgentIntegration drives the real agent CLIs against a fake model.
      # testdata/agent-clis pins them, so a new agent release arrives as its
      # own dependency bump and fails there instead of on an unrelated PR.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.scope.outputs.run == 'true' && matrix.module == 'plugins/agento11y'
        with:
          node-version: '24'

      - name: Agent CLI integration
        if: steps.scope.outputs.run == 'true' && matrix.module == 'plugins/agento11y'
        env:
          GOWORK: "off"
          AGENT_CLI_TESTS: claude,codex
        run: |
          cd ${{ matrix.module }}/internal/entry
          npm ci --prefix testdata/agent-clis
          PATH="$PWD/testdata/agent-clis/node_modules/.bin:$PATH" go test . -run TestAgentIntegration -count=1 -v

      - name: Build agento11y CLI
        if: steps.scope.outputs.run == 'true' && matrix.module == 'plugins/agento11y'
        env:
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            echo "::group::build $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
            echo "::endgroup::"
          done

  go-plugin-windows:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'go-plugin-windows')
    name: Go plugin (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: plugins/agento11y/go.mod

      - name: Test
        working-directory: plugins/agento11y
        run: go test ./...
        env:
          GOWORK: "off"

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    needs: [changes, scripts, go-module, go-plugin-windows]
    if: always()
    steps:
      - name: Verify all Go jobs succeeded
        run: |
          if [[ "${{ needs.changes.result }}" != "success" || "${{ needs.scripts.result }}" != "success" ]]; then
            echo "CI selection or workflow-script checks failed"
            exit 1
          fi
          if [[ "${{ needs.go-module.result }}" != "success" ]]; then
            echo "Go module matrix did not succeed: ${{ needs.go-module.result }}"
            exit 1
          fi
          if [[ "${{ needs.go-plugin-windows.result }}" != "success" && "${{ needs.go-plugin-windows.result }}" != "skipped" ]]; then
            echo "Go plugin Windows job did not succeed: ${{ needs.go-plugin-windows.result }}"
            exit 1
          fi

  typescript:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'typescript')
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          install_args: biome
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: mise run lint:ts:sdk-js

      - name: Typecheck
        run: pnpm --filter @grafana/agento11y run typecheck

      - name: Test
        run: pnpm --filter @grafana/agento11y run test:ci

      - name: Lint pi plugin
        run: mise run lint:ts:plugin-pi

      - name: Typecheck pi plugin
        run: pnpm --filter @grafana/agento11y-pi run typecheck

      - name: Test pi plugin
        run: pnpm --filter @grafana/agento11y-pi run test

      - name: Test pi plugin through the native file loader
        timeout-minutes: 10
        run: mise run test:ts:plugin-pi-native

      - name: Lint opencode plugin
        run: mise run lint:ts:plugin-opencode

      - name: Lint local viewer
        run: mise run lint:ts:local-viewer

      - name: Typecheck local viewer
        run: mise run typecheck:ts:local-viewer

      - name: Test local viewer
        run: mise run test:ts:local-viewer

      - name: Typecheck opencode plugin
        run: pnpm --filter @grafana/agento11y-opencode run typecheck

      - name: Test opencode plugin
        run: pnpm --filter @grafana/agento11y-opencode run test

      - name: Build opencode plugin
        run: pnpm --filter @grafana/agento11y-opencode run build

  hermes-checks:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'hermes')
    name: Hermes lint, types, and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.11'
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: false
      - run: mise run lint:py:plugin-hermes
      - run: mise run typecheck:py:plugin-hermes
      - run: mise run build:py:plugin-hermes

  hermes-test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'hermes')
    name: Hermes Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: false
      - run: mise run test:py:plugin-hermes ${{ matrix.python-version }}

  python-lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'python-lint')
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          install_args: ruff
          cache: true

      - name: ruff check
        run: mise run lint:py

  python:
    needs: changes
    name: Python SDK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: core, cmd: "uv run --with '.[dev]' --directory python pytest tests" }
          - { name: openai, cmd: "uv run --with './python[dev]' --with './python-providers/openai[dev]' pytest python-providers/openai/tests" }
          - { name: anthropic, cmd: "uv run --with './python[dev]' --with './python-providers/anthropic[dev]' pytest python-providers/anthropic/tests" }
          - { name: gemini, cmd: "uv run --with './python[dev]' --with './python-providers/gemini[dev]' pytest python-providers/gemini/tests" }
          - { name: langchain, cmd: "uv run --with './python[dev]' --with './python-frameworks/langchain[dev]' pytest python-frameworks/langchain/tests" }
          - { name: langgraph, cmd: "uv run --with './python[dev]' --with './python-frameworks/langgraph[dev]' pytest python-frameworks/langgraph/tests" }
          - { name: openai-agents, cmd: "uv run --with './python[dev]' --with './python-frameworks/openai-agents[dev]' pytest python-frameworks/openai-agents/tests" }
          - { name: llamaindex, cmd: "uv run --with './python[dev]' --with './python-frameworks/llamaindex[dev]' pytest python-frameworks/llamaindex/tests" }
          - { name: google-adk, cmd: "uv run --with './python[dev]' --with './python-frameworks/google-adk[dev]' pytest python-frameworks/google-adk/tests" }
          - { name: litellm, cmd: "uv run --with './python[dev]' --with './python-frameworks/litellm[dev]' pytest python-frameworks/litellm/tests" }
          - { name: pydantic-ai, cmd: "uv run --with './python[dev]' --with './python-frameworks/pydantic-ai[dev]' pytest python-frameworks/pydantic-ai/tests" }
          - { name: deepeval, cmd: "uv run --with './python[dev]' --with './python-frameworks/deepeval[dev]' pytest python-frameworks/deepeval/tests" }
          - { name: harbor, cmd: "uv run --with './python[dev]' --with './python-frameworks/harbor[dev]' pytest python-frameworks/harbor/tests" }
          - { name: strands, cmd: "uv run --with './python[dev]' --with './python-frameworks/strands[dev]' pytest python-frameworks/strands/tests" }
    steps:
      # Keep every existing matrix check name for branch protection.
      - name: Check whether this suite is affected
        id: scope
        run: echo "run=${{ contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'python-all') || contains(fromJSON(needs.changes.outputs.scope), format('python:{0}', matrix.suite.name)) }}" >> "$GITHUB_OUTPUT"

      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install uv
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Test ${{ matrix.suite.name }}
        if: steps.scope.outputs.run == 'true'
        run: ${{ matrix.suite.cmd }}

  python-core:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'python-core')
    name: Python SDK core / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PYTHON_BIN: python3
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: false

      - name: Test core
        run: mise run test:py:sdk-core

  dotnet:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'dotnet')
    name: .NET SDK
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
      FORCE_COLOR: 3
      NUGET_XMLDOC_MODE: skip
      TERM: xterm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: dotnet/global.json

      - name: Restore
        run: dotnet restore dotnet/Agento11y.DotNet.slnx

      - name: Format check
        run: dotnet format dotnet/Agento11y.DotNet.slnx --verify-no-changes --no-restore

      - name: Format check (generated pattern table)
        run: |
          dotnet format dotnet/Agento11y.DotNet.slnx --verify-no-changes --no-restore \
            --include-generated --include dotnet/src/Grafana.Agento11y/RedactionPatterns.g.cs

      - name: Test
        run: dotnet test dotnet/Agento11y.DotNet.slnx -c Release

      - name: Pack
        run: dotnet pack dotnet/Agento11y.DotNet.slnx -c Release

      - name: Publish packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-packages
          path: ./dotnet/artifacts/package/release
          retention-days: 5

  java:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.scope), 'all') || contains(fromJSON(needs.changes.outputs.scope), 'java')
    name: Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Test
        working-directory: java
        run: ./gradlew --no-daemon test
