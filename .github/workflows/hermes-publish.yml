name: Publish Hermes to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver bump for the next release PR
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      dry-run:
        description: Preview local changes without opening a PR or publishing
        type: boolean
        default: true
  push:
    tags:
      - 'plugins/hermes/v*'

permissions:
  contents: read

concurrency:
  group: hermes-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'grafana/agento11y' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: python .github/scripts/hermes-release.test.py
      - name: Prepare local release preview
        env:
          BUMP: ${{ inputs.version }}
        run: |
          python .github/scripts/hermes-release.py prepare "$BUMP"
          git diff -- plugins/hermes/pyproject.toml plugins/hermes/uv.lock plugins/hermes/CHANGELOG.md

  release-pr:
    needs: prepare
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Prepare release PR
        id: release
        env:
          BUMP: ${{ inputs.version }}
        run: |
          VERSION=$(python .github/scripts/hermes-release.py prepare "$BUMP")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub token
        id: token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: grafana-plugins-platform-bot
      - name: Open release PR for review
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.token.outputs.token }}
          branch: release/hermes-${{ steps.release.outputs.version }}
          base: main
          sign-commits: true
          add-paths: |
            plugins/hermes/pyproject.toml
            plugins/hermes/uv.lock
            plugins/hermes/CHANGELOG.md
          commit-message: 'chore(hermes): release ${{ steps.release.outputs.version }}'
          title: 'chore(hermes): release ${{ steps.release.outputs.version }}'
          body: 'Prepare `agento11y-hermes` ${{ steps.release.outputs.version }}. Merging creates the release tag and starts PyPI publishing. This PR requires review; auto-merge is not enabled.'

  build:
    if: github.repository == 'grafana/agento11y' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugins/hermes/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: python .github/scripts/hermes-release.test.py
      - name: Validate release tag
        id: release
        env:
          REF: ${{ github.ref }}
        run: |
          VERSION=$(python .github/scripts/hermes-release.py guard "$REF")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: bash plugins/hermes/scripts/run-check.sh lint
      - run: bash plugins/hermes/scripts/run-check.sh typecheck
      - run: bash plugins/hermes/scripts/run-check.sh test '${{ matrix.python }}'
      - name: Build and test distributions
        if: matrix.python == '3.11'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bash plugins/hermes/scripts/run-check.sh build --expected-version "$VERSION" --output-dir "$PWD/dist/hermes"
      - name: Upload tested distributions
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-dists
          path: dist/hermes/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugins/hermes/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermes-dists
          path: dist/hermes/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/hermes/
          attestations: true
