[project]
name = "agentcore-observability-demo"
version = "0.1.0"
description = "Amazon Bedrock AgentCore example instrumented with Grafana Agent Observability"
requires-python = ">=3.10"
dependencies = [
    "agento11y>=0.11.0",
    "agento11y-langchain>=0.11.0",
    "bedrock-agentcore>=1.10.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.1",
    "langchain>=1.2.0",
    "langchain-core>=1.3.0",
    "langchain-anthropic>=1.4.0",
    "langchain-aws>=0.2.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[tool.uv]
package = false
