[project]
name = "agento11y-deepeval-example"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "agento11y",
  "agento11y-deepeval",
]

[tool.uv.sources]
agento11y = { path = "../../../python", editable = true }
agento11y-deepeval = { path = "../../../python-frameworks/deepeval", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
