[project]
name = "agentcore-otlp-demo"
version = "0.1.0"
description = "Amazon Bedrock AgentCore example instrumented with OpenTelemetry only, sending to Grafana Cloud Agent Observability"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore>=1.10.0",
    "boto3[crt]>=1.41.0",
    "python-dotenv>=1.0.1",
    "langchain>=1.2.0",
    "langchain-core>=1.3.0",
    "langchain-anthropic>=1.4.0",
    "langchain-aws>=0.2.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[tool.uv]
package = false
