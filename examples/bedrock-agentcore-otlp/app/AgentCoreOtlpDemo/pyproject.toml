[project]
name = "agentcore-otlp-demo"
version = "0.1.0"
description = "Amazon Bedrock AgentCore example instrumented with OpenTelemetry only, sending to Grafana Cloud Agent Observability"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore>=1.10.0",
    "boto3[crt]>=1.41.0",
    "python-dotenv>=1.0.1",
    "langchain>=1.3.0",
    "langchain-core>=1.7.6",
    "langchain-anthropic>=1.4.0",
    "langchain-aws>=1.9.3",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[tool.uv]
package = false
