[tools]
biome = "2.4.11"
ruff = "0.15.12"
go = "1.25.7"
protoc = "34.1"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "v1.36.11"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "v1.6.1"

[env]
PYTHON_BIN = "python3"
# Pin the Python protobuf toolchain so generated stubs are reproducible across
# machines and CI. Bumping these requires regenerating stubs via
# `mise run generate:proto:python`.
SIGIL_GRPCIO_TOOLS_VERSION = "1.80.0"
SIGIL_PROTOBUF_VERSION = "6.31.1"

# --- Dependencies ---

[tasks.deps]
description = "Install JS/TS dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."deps:update"]
description = "Update JS/TS dependencies and pnpm lockfile"
run = "pnpm install --no-frozen-lockfile"

# --- Formatting ---

[tasks."format:go"]
description = "Format Go code in all modules"
run = """
#!/usr/bin/env bash
set -euo pipefail
while IFS= read -r moddir; do
  echo "==> gofmt ${moddir}"
  gofmt -w "${moddir}"
done < <(find . -name go.mod -not -path './node_modules/*' -exec dirname {} \\; | sort)
"""

[tasks."format:py"]
description = "Format Python SDK code"
run = "ruff format python/ python-providers/ python-frameworks/"

[tasks."format:cs"]
description = "Format .NET SDK code"
run = "dotnet format dotnet/Agento11y.DotNet.slnx"

[tasks."format:ts:sdk-js"]
description = "Format TypeScript/JavaScript SDK code"
depends = ["deps"]
run = "pnpm --filter @grafana/agento11y run lint:fix"

[tasks."format:ts:plugin-pi"]
description = "Format Pi plugin code"
depends = ["deps"]
run = "pnpm --filter @grafana/agento11y-pi run lint:fix"

[tasks."format:ts:plugin-opencode"]
description = "Format OpenCode plugin code"
depends = ["deps"]
run = "pnpm --filter @grafana/agento11y-opencode run lint:fix"

[tasks.format]
description = "Format all code"
depends = ["format:go", "format:py", "format:cs", "format:ts:sdk-js", "format:ts:plugin-pi", "format:ts:plugin-opencode"]

# --- Linting ---

[tasks."lint:go"]
description = "Lint Go code in all modules"
run = """
#!/usr/bin/env bash
set -euo pipefail
while IFS= read -r moddir; do
  if [[ -z "$(cd "${moddir}" && GOWORK=off go list ./... 2>/dev/null || true)" ]]; then
    echo "==> skip golangci-lint ${moddir} (no Go packages)"
    continue
  fi
  echo "==> golangci-lint ${moddir}"
  lint_args=()
  if [[ "${moddir}" == "./go/otelgenai/conformance" ]]; then
    lint_args+=(--build-tags=conformance)
  fi
  (cd "${moddir}" && GOWORK=off golangci-lint run "${lint_args[@]}" ./...)
done < <(find . -name go.mod -not -path './node_modules/*' -exec dirname {} \\; | sort)
"""

[tasks."lint:py"]
description = "Lint and format-check Python SDK code"
run = """
#!/usr/bin/env bash
set -euo pipefail
ruff check python/ python-providers/ python-frameworks/
ruff format --check python/ python-providers/ python-frameworks/
"""

[tasks."lint:cs"]
description = "Verify .NET SDK formatting and analyzer checks"
run = """
#!/usr/bin/env bash
set -euo pipefail
dotnet format dotnet/Agento11y.DotNet.slnx --verify-no-changes
# dotnet format skips *.g.cs unless --include-generated is passed, and passing it
# for the whole solution would also check the protobuf stubs under obj/. Name the
# one generated file this repository owns instead.
dotnet format dotnet/Agento11y.DotNet.slnx --verify-no-changes --include-generated \\
  --include dotnet/src/Grafana.Agento11y/RedactionPatterns.g.cs
"""

[tasks."lint:ts:sdk-js"]
description = "Lint TypeScript/JavaScript SDK code"
depends = ["deps"]
run = "pnpm --filter @grafana/agento11y run lint"

[tasks."lint:ts:plugin-pi"]
description = "Lint Pi plugin code"
depends = ["deps"]
run = "pnpm --filter @grafana/agento11y-pi run lint"

[tasks."lint:ts:plugin-opencode"]
description = "Lint OpenCode plugin code"
depends = ["deps"]
run = "pnpm --filter @grafana/agento11y-opencode run lint"

[tasks."lint:ts:redaction-generator"]
description = "Lint the secret-pattern generator"
dir = "redaction"
run = "biome check ."

[tasks."lint:js-dependency-pinning"]
description = "Verify JavaScript dependencies are pinned where required"
run = "pnpm run check:js-dependency-pinning"

[tasks.lint]
description = "Run all linting"
depends = ["lint:go", "lint:py", "lint:cs", "lint:ts:sdk-js", "lint:ts:plugin-pi", "lint:ts:plugin-opencode", "lint:ts:redaction-generator", "lint:js-dependency-pinning"]

# --- Type checking ---

[tasks."typecheck:ts:sdk-js"]
description = "Type-check TypeScript/JavaScript SDK code"
depends = ["deps"]
run = "pnpm --filter @grafana/agento11y run typecheck"

[tasks."typecheck:ts:plugin-pi"]
description = "Type-check Pi plugin code"
depends = ["deps", "build:ts:sdk-js"]
run = "pnpm --filter @grafana/agento11y-pi run typecheck"

[tasks."typecheck:ts:plugin-opencode"]
description = "Type-check OpenCode plugin code"
depends = ["deps", "build:ts:sdk-js"]
run = "pnpm --filter @grafana/agento11y-opencode run typecheck"

[tasks.typecheck]
description = "Run all type checks"
depends = ["typecheck:ts:sdk-js", "typecheck:ts:plugin-pi", "typecheck:ts:plugin-opencode"]

# --- Build ---

# build:ts:sdk-js produces the workspace-linked dist/ that plugin tasks
# (typecheck/test/build) import from. Declared with sources/outputs so mise
# skips the rebuild when dist/ is newer than every input -- the same
# staleness check the previous plugins/*/scripts/ensure-sdk.sh did by hand.
[tasks."build:ts:sdk-js"]
description = "Build the TypeScript/JavaScript SDK bundle"
depends = ["deps"]
sources = [
  "js/src/**/*.ts",
  "js/proto/**/*",
  "js/scripts/**/*",
  "js/package.json",
  "js/tsconfig.json",
  "js/tsconfig.build.json",
]
outputs = ["js/dist/index.js", "js/dist/index.d.ts"]
run = "pnpm --filter @grafana/agento11y run build"

[tasks."build:ts:plugin-pi"]
description = "Build Pi plugin bundle"
depends = ["deps", "build:ts:sdk-js"]
run = "pnpm --filter @grafana/agento11y-pi run build"

[tasks."build:ts:plugin-opencode"]
description = "Build OpenCode plugin bundle"
depends = ["deps", "build:ts:sdk-js"]
run = "pnpm --filter @grafana/agento11y-opencode run build"

# --- Go SDK tests ---

[tasks."test:go:sdk-core"]
description = "Run Go SDK core tests as standalone module"
dir = "go"
run = "GOWORK=off go test ./..."

[tasks."test:go:sdk-anthropic"]
description = "Run Anthropic provider helper tests as standalone module"
dir = "go-providers/anthropic"
run = "GOWORK=off go test ./..."

[tasks."test:go:sdk-openai"]
description = "Run OpenAI provider helper tests as standalone module"
dir = "go-providers/openai"
run = "GOWORK=off go test ./..."

[tasks."test:go:sdk-gemini"]
description = "Run Gemini provider helper tests as standalone module"
dir = "go-providers/gemini"
run = "GOWORK=off go test ./..."

[tasks."test:go:sdk-google-adk"]
description = "Run Google ADK framework helper tests as standalone module"
dir = "go-frameworks/google-adk"
run = "GOWORK=off go test ./..."

[tasks."test:go:plugin"]
description = "Run agento11y plugin tests as standalone module"
dir = "plugins/agento11y"
run = "GOWORK=off go test ./..."

[tasks."test:go:conformance"]
description = "Check otelgenai telemetry against the pinned GenAI semantic-convention registry"
dir = "go/otelgenai/conformance"
run = "GOWORK=off go test -tags conformance ./..."

[tasks."test:ts:plugin-pi"]
description = "Run Pi plugin tests"
depends = ["deps", "build:ts:sdk-js"]
run = "pnpm --filter @grafana/agento11y-pi run test"

[tasks."test:ts:plugin-opencode"]
description = "Run OpenCode plugin tests"
depends = ["deps", "build:ts:sdk-js"]
run = "pnpm --filter @grafana/agento11y-opencode run test"

[tasks."test:go:sdk-conformance"]
description = "Run the Go SDK core conformance harness"
dir = "go"
run = "GOWORK=off go test ./agento11y -run '^TestConformance' -count=1"

[tasks."test:go:sdk-hooks-conformance"]
description = "Run the Go SDK hook tests: wire fixtures and guard behavior"
dir = "go"
run = "GOWORK=off go test ./agento11y -run '^TestHook' -count=1"

[tasks."test:go:sdk-experiments-conformance"]
description = "Run the Go experiments wire-fixture conformance tests"
dir = "go"
run = "GOWORK=off go test ./agento11y/experiments -run '^TestExperimentsConformance' -count=1"

# --- TypeScript/JavaScript SDK tests ---

[tasks."test:ts:sdk-js"]
description = "Run TypeScript/JavaScript SDK runtime tests"
depends = ["deps"]
run = "pnpm --filter @grafana/agento11y run test:ci"

[tasks."test:ts:sdk-conformance"]
description = "Run TypeScript/JavaScript SDK core conformance tests"
depends = ["deps"]
dir = "js"
run = "pnpm run test:build && node --test test/conformance.test.mjs"

[tasks."test:ts:sdk-experiments"]
description = "Run TypeScript/JavaScript SDK experiments tests"
depends = ["deps"]
dir = "js"
run = "pnpm run test:build && node --import ./test/_setup.mjs --test test/experiments.*.test.mjs"

[tasks."test:ts:sdk-experiments-conformance"]
description = "Run TypeScript/JavaScript experiments wire-fixture conformance tests"
depends = ["deps"]
dir = "js"
run = "pnpm run test:build && node --import ./test/_setup.mjs --test test/experiments.conformance.test.mjs"

[tasks."test:ts:sdk-hooks-conformance"]
description = "Run the TypeScript/JavaScript SDK hook tests: wire fixtures and guard behavior"
depends = ["deps"]
dir = "js"
run = "pnpm run test:build && node --test test/hooks.conformance.test.mjs test/hooks.integration.test.mjs"

[tasks."test:ts:sdk-provider-conformance"]
description = "Run TypeScript/JavaScript provider-wrapper conformance tests"
depends = ["deps"]
dir = "js"
run = "pnpm run test:build && node --test test/providers.test.mjs"

[tasks."test:ts:sdk-framework-conformance"]
description = "Run TypeScript/JavaScript framework-adapter conformance tests"
depends = ["deps"]
run = "mise run test:ts:sdk-js-frameworks"

[tasks."test:ts:sdk-js-frameworks"]
description = "Run TypeScript/JavaScript SDK framework handler tests"
depends = ["deps"]
dir = "js"
run = "pnpm run test:build && node --test test/frameworks.langchain.test.mjs test/frameworks.langgraph.test.mjs test/frameworks.additional.test.mjs test/frameworks.vercel-ai-sdk.mapping.test.mjs test/frameworks.vercel-ai-sdk.test.mjs"

# --- Python SDK tests ---

[tasks."test:py:sdk-core"]
description = "Run Python SDK core parity tests"
run = "uv run --python \"$PYTHON_BIN\" --with '.[dev]' --directory python pytest tests"

[tasks."test:py:sdk-conformance"]
description = "Run Python SDK core conformance tests"
run = "uv run --python \"$PYTHON_BIN\" --with '.[dev]' --directory python pytest tests/test_conformance.py"

[tasks."test:py:sdk-hooks-conformance"]
description = "Run the Python SDK hook tests: wire fixtures and guard behavior"
run = "uv run --python \"$PYTHON_BIN\" --with '.[dev]' --directory python pytest tests/test_hooks_conformance.py tests/test_hooks_integration.py"

[tasks."test:py:sdk-experiments-conformance"]
description = "Run the Python experiments wire-fixture conformance tests"
run = "uv run --python \"$PYTHON_BIN\" --with '.[dev]' --directory python pytest tests/test_experiments_conformance.py"

[tasks."test:py:sdk-openai"]
description = "Run Python OpenAI provider helper tests"
run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with './python-providers/openai[dev]' pytest python-providers/openai/tests"

[tasks."test:py:sdk-anthropic"]
description = "Run Python Anthropic provider helper tests"
run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with './python-providers/anthropic[dev]' pytest python-providers/anthropic/tests"

[tasks."test:py:sdk-gemini"]
description = "Run Python Gemini provider helper tests"
run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with './python-providers/gemini[dev]' pytest python-providers/gemini/tests"

[tasks."test:py:sdk-langchain"]
description = "Run Python LangChain framework handler tests"
run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with './python-frameworks/langchain[dev]' pytest python-frameworks/langchain/tests"

[tasks."test:py:sdk-langgraph"]
description = "Run Python LangGraph framework handler tests"
run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with './python-frameworks/langgraph[dev]' pytest python-frameworks/langgraph/tests"

[tasks."test:py:sdk-openai-agents"]
description = "Run Python OpenAI Agents framework handler tests"
run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with './python-frameworks/openai-agents[dev]' pytest python-frameworks/openai-agents/tests"

[tasks."test:py:sdk-llamaindex"]
description = "Run Python LlamaIndex framework handler tests"
run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with './python-frameworks/llamaindex[dev]' pytest python-frameworks/llamaindex/tests"

[tasks."test:py:sdk-google-adk"]
description = "Run Python Google ADK framework handler tests"
run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with './python-frameworks/google-adk[dev]' pytest python-frameworks/google-adk/tests"

[tasks."test:py:sdk-strands"]
description = "Run Python Strands framework handler tests"
run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with './python-frameworks/strands[dev]' pytest python-frameworks/strands/tests"

[tasks."test:py:sdk-claude-agent-sdk"]
