[tasks."test:cs:sdk-redaction-conformance"]
description = "Run the .NET SDK redaction conformance suite"
dir = "dotnet"
run = "dotnet test tests/Grafana.Agento11y.Tests/Grafana.Agento11y.Tests.csproj -c Release --filter FullyQualifiedName~RedactionConformance"

[tasks."test:sdk:redaction-conformance"]
description = "Run the shared redaction fixtures through every engine (four SDKs plus both plugins)"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:go:sdk-redaction-conformance
mise run test:py:sdk-redaction-conformance
mise run test:ts:sdk-redaction-conformance
mise run test:cs:sdk-redaction-conformance
mise run test:go:plugin-redaction-conformance
mise run test:ts:plugin-opencode-redaction-conformance
"""

[tasks."test:sdk:conformance"]
description = "Run the core, hook, experiment, provider-wrapper, framework-adapter, pi-session, and redaction conformance suites across supported SDKs"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:sdk:core-conformance
mise run test:sdk:hooks-conformance
mise run test:sdk:experiments-conformance
mise run test:sdk:provider-conformance
mise run test:sdk:framework-conformance
mise run test:pi-sessions-conformance
mise run test:sdk:redaction-conformance
"""

[tasks."test:sdk:all"]
description = "Run all SDK checks (Go, TypeScript/JavaScript, Python, Java, and .NET SDK suites)"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:go:sdk-core
mise run test:go:conformance
mise run test:go:sdk-anthropic
mise run test:go:sdk-openai
