depends = ["deps", "build:ts:sdk-js"]
dir = "plugins/opencode"
run = "pnpm exec vitest run src/redact.conformance.test.ts"

[tasks."test:py:sdk-redaction-conformance"]
description = "Run the Python SDK redaction conformance suite"
