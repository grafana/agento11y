[tasks."test:java:sdk-all"]
description = "Run all Java SDK tests"
dir = "java"
run = "./gradlew --no-daemon :core:test :providers:openai:test :providers:anthropic:test :providers:gemini:test :frameworks:google-adk:test"

[tasks."test:java:sdk-provider-conformance"]
description = "Run Java provider-wrapper conformance tests"
dir = "java"
run = "./gradlew --no-daemon :providers:openai:test :providers:anthropic:test :providers:gemini:test"

[tasks."test:java:sdk-framework-conformance"]
description = "Run Java framework-adapter conformance tests"
dir = "java"
run = "./gradlew --no-daemon :frameworks:google-adk:test"

[tasks."benchmark:java:sdk"]
description = "Run Java SDK JMH benchmarks"
dir = "java"
run = "./gradlew --no-daemon :benchmarks:jmh"

# --- Cross-SDK conformance ---

[tasks."test:sdk:core-conformance"]
description = "Run core conformance suites across Go, TypeScript/JavaScript, Python, Java, and .NET SDKs"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:go:sdk-conformance
mise run test:ts:sdk-conformance
mise run test:py:sdk-conformance
mise run test:java:sdk-conformance
mise run test:cs:sdk-conformance
"""

[tasks."test:sdk:hooks-conformance"]
description = """
Run the hook tests in Go, Python, and TypeScript/JavaScript: wire fixtures and
guard behavior. Java and .NET have no hook support, so they are excluded.
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:go:sdk-hooks-conformance
mise run test:ts:sdk-hooks-conformance
mise run test:py:sdk-hooks-conformance
"""

[tasks."test:sdk:experiments-conformance"]
description = """
Run the experiment wire-fixture tests in Go, Python, and TypeScript/JavaScript.
Java and .NET have no experiments surface, so they are excluded.
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:go:sdk-experiments-conformance
mise run test:ts:sdk-experiments-conformance
mise run test:py:sdk-experiments-conformance
"""

[tasks."test:sdk:provider-conformance"]
description = "Run provider-wrapper conformance suites across all shipped SDKs"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:go:sdk-anthropic
mise run test:go:sdk-openai
mise run test:go:sdk-gemini
mise run test:ts:sdk-provider-conformance
mise run test:py:sdk-provider-conformance
mise run test:cs:sdk-provider-conformance
mise run test:java:sdk-provider-conformance
"""

[tasks."test:sdk:framework-conformance"]
description = "Run framework-adapter conformance suites across all shipped SDKs"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:go:sdk-google-adk
mise run test:ts:sdk-framework-conformance
mise run test:py:sdk-framework-conformance
mise run test:java:sdk-framework-conformance
"""

[tasks."test:go:pi-sessions-conformance"]
description = "Run the Go half of the pi session-log conformance tests"
dir = "plugins/agento11y"
run = "GOWORK=off go test ./internal/history -run '^TestPiSession' -count=1"

[tasks."test:ts:pi-sessions-conformance"]
description = "Run the TypeScript half of the pi session-log conformance tests"
depends = ["deps", "build:ts:sdk-js"]
run = "pnpm --filter @grafana/agento11y-pi exec vitest run src/piSessionConformance.test.ts"

[tasks."test:pi-sessions-conformance"]
description = """
Check the Go pi history importer and the TypeScript pi plugin against the shared
conformance/pi-sessions fixtures. pi is the one agent whose live capture is
TypeScript and whose importer is Go, so the fixtures are the only thing holding
the two mappings together.
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:go:pi-sessions-conformance
mise run test:ts:pi-sessions-conformance
"""

[tasks."test:go:sdk-redaction-conformance"]
description = "Run the Go SDK redaction conformance suite"
dir = "go"
run = "GOWORK=off go test ./agento11y -run '^TestConformanceRedaction' -count=1"

[tasks."test:go:plugin-redaction-conformance"]
description = "Run the shared Go plugin redaction conformance suite"
dir = "plugins/agento11y"
run = "GOWORK=off go test ./internal/redact -run '^TestConformanceRedaction' -count=1"

[tasks."test:ts:sdk-redaction-conformance"]
description = "Run the TypeScript/JavaScript SDK redaction conformance suite"
depends = ["deps"]
dir = "js"
run = "pnpm run test:build && node --test test/redaction.conformance.test.mjs"

[tasks."test:ts:plugin-opencode-redaction-conformance"]
