mise run test:py:sdk-litellm
"""

# --- .NET SDK tests ---

[tasks."test:cs:sdk-core"]
description = "Run .NET SDK core runtime tests"
dir = "dotnet"
run = "dotnet test tests/Grafana.Agento11y.Tests/Grafana.Agento11y.Tests.csproj -c Release"

[tasks."test:cs:sdk-conformance"]
description = "Run .NET SDK core conformance tests"
dir = "dotnet"
run = "dotnet test tests/Grafana.Agento11y.Tests/Grafana.Agento11y.Tests.csproj -c Release --filter FullyQualifiedName~ConformanceTests"

[tasks."test:cs:sdk-openai"]
description = "Run .NET OpenAI provider helper tests"
dir = "dotnet"
run = "dotnet test tests/Grafana.Agento11y.OpenAI.Tests/Grafana.Agento11y.OpenAI.Tests.csproj -c Release"

[tasks."test:cs:sdk-anthropic"]
