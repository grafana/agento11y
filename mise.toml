[tasks."sdk:conformance"]
description = "Alias for test:sdk:conformance"
run = "mise run test:sdk:conformance"

# --- Python version bump ---

[tasks."sdk:py:bump"]
description = "Bump version across all Python SDK pyproject.toml files"
run = '''
#!/usr/bin/env bash
set -euo pipefail

VERSION="${1:?Usage: mise run sdk:py:bump <VERSION>}"
if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
  echo "Error: version must be in MAJOR.MINOR.PATCH format (got: $VERSION)" >&2
  exit 1
fi

PACKAGE_DIRS=(
  python
  python-providers/openai
  python-providers/anthropic
  python-providers/gemini
  python-frameworks/langchain
  python-frameworks/langgraph
  python-frameworks/openai-agents
  python-frameworks/llamaindex
  python-frameworks/google-adk
  python-frameworks/litellm
  python-frameworks/pydantic-ai
  python-frameworks/strands
  python-frameworks/claude-agent-sdk
)

for dir in "${PACKAGE_DIRS[@]}"; do
  file="${dir}/pyproject.toml"
  perl -i -pe "s/^version = \".*\"/version = \"${VERSION}\"/" "$file"
  if [[ "$dir" != "python" ]]; then
    perl -i -pe "s/\"agento11y>=.*\"/\"agento11y>=${VERSION}\"/" "$file"
  fi
  echo "  updated ${file}"
done

echo "All Python SDK versions bumped to ${VERSION}"
'''

# --- Proto generation ---

[tasks."generate:proto:go"]
description = "Regenerate Go protobuf stubs from proto/agento11y/v1/*.proto"
run = "bash go/scripts/generate_proto.sh"

[tasks."generate:proto:python"]
description = "Regenerate Python protobuf stubs from proto/agento11y/v1/*.proto"
run = "bash python/scripts/generate_proto.sh"

[tasks."generate:proto:js"]
description = "Sync proto/agento11y/v1/*.proto into js/proto for the JS SDK"
depends = ["deps"]
run = "pnpm --filter @grafana/agento11y run sync-proto"

[tasks."generate:proto"]
description = "Regenerate protobuf stubs for all SDKs"
depends = ["generate:proto:go", "generate:proto:python", "generate:proto:js"]

[tasks."check:proto"]
description = "Fail if generated protobuf stubs drift from proto/agento11y/v1/*.proto"
run = """
#!/usr/bin/env bash
set -euo pipefail

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

fail=0

echo "==> check:proto go"
bash go/scripts/generate_proto.sh "$tmp/go"
if ! diff -ruN go/proto/agento11y/v1 "$tmp/go/agento11y/v1"; then
  echo >&2 "::error::Go protobuf stubs are out of sync with proto/agento11y/v1/*.proto"
  fail=1
fi

echo "==> check:proto python"
bash python/scripts/generate_proto.sh "$tmp/python"
if ! diff -ruN python/agento11y/internal/gen "$tmp/python"; then
  echo >&2 "::error::Python protobuf stubs are out of sync with proto/agento11y/v1/*.proto"
  fail=1
fi

echo "==> check:proto js"
mkdir -p "$tmp/js"
node js/scripts/sync-proto.mjs "$tmp/js"
if ! diff -ruN js/proto/agento11y "$tmp/js/agento11y"; then
  echo >&2 "::error::JS proto copy in js/proto/agento11y is out of sync with proto/agento11y/v1/*.proto"
  fail=1
fi

if [[ $fail -ne 0 ]]; then
  cat >&2 <<'EOF'

Generated protobuf code drifted from proto/agento11y/v1/*.proto.
Run `mise run generate:proto` and commit the regenerated files.
EOF
  exit 1
fi

echo "==> check:proto: stubs in sync"
"""

# --- Redaction pattern generation ---

[tasks."generate:redaction"]
description = "Regenerate the per-language secret-pattern tables from redaction/patterns.json"
run = "node redaction/scripts/generate.mjs"

[tasks."test:redaction:generator"]
description = "Run the redaction pattern generator's invariant tests"
run = "node --test redaction/scripts/generate.test.mjs"

[tasks."check:redaction"]
description = "Fail if the generated secret-pattern tables drift from redaction/patterns.json"
depends = ["test:redaction:generator"]
run = """
#!/usr/bin/env bash
set -euo pipefail

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

echo "==> check:redaction regenerate"
# The generator prints one "generated <path>" line per file it writes, so a new
# output target is diffed here without anyone maintaining a second list.
generated="$(node redaction/scripts/generate.mjs "$tmp")"
if [[ -z "$generated" ]]; then
  echo >&2 "redaction generator wrote no files"
  exit 1
fi

fail=0
while IFS= read -r line; do
  target="${line#generated }"
  if ! diff -uN "$target" "$tmp/$target"; then
    echo >&2 "::error file=${target}::${target} is out of sync with redaction/patterns.json"
    fail=1
  fi
done <<< "$generated"

if [[ $fail -ne 0 ]]; then
  cat >&2 <<'EOF'

Generated secret-pattern tables drifted from redaction/patterns.json.
Run `mise run generate:redaction` and commit the regenerated files.
EOF
  exit 1
fi

echo "==> check:redaction: pattern tables in sync"
"""

