run = "uv run --python \"$PYTHON_BIN\" --with './python[dev]' --with-editable './python-frameworks/claude-agent-sdk[dev]' pytest python-frameworks/claude-agent-sdk/tests"

[tasks."test:py:sdk-litellm"]
